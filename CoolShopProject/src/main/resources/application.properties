server.port = 8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/CoolShopDB
spring.datasource.username=root
spring.datasource.password=Quang@12345

# JPA / Hibernate - update tự thêm cột mới
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Cho phép Hibernate tạo bảng/cột mới mà không cần validate
spring.jpa.properties.hibernate.hbm2ddl.auto=update

spring.application.name=CoolShopProject

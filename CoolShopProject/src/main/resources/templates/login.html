<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - CoolShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<div>
    <div class="brand">Cool<span>Shop</span></div>

    <div class="auth-panel">
        <div class="auth-panel-body">
            <h1 class="auth-title">Đăng nhập</h1>

            <div th:if="${param.error}" class="alert auth-alert auth-alert-danger mb-3">
                Sai tên đăng nhập hoặc mật khẩu.
            </div>
            <div th:if="${param.logout}" class="alert auth-alert auth-alert-success mb-3">
                Bạn đã đăng xuất.
            </div>
            <div th:if="${success}" class="alert auth-alert auth-alert-success mb-3" th:text="${success}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Tên đăng nhập</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person-fill"></i>
                        <input class="form-control" type="text" id="username" name="username"
                               placeholder="Tên đăng nhập" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-lock-fill"></i>
                        <input class="form-control" type="password" id="password" name="password"
                               placeholder="Mật khẩu" required>
                    </div>
                </div>
                <button class="btn btn-auth" type="submit">Đăng nhập</button>
            </form>
        </div>

        <div class="auth-footer">
            <p>Chưa có tài khoản?</p>
            <a class="btn-signup" th:href="@{/register}">Tạo tài khoản</a>
        </div>
    </div>
</div>
</body>
</html>

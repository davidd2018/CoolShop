<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang chủ - CoolShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="home-page">
<nav class="home-nav">
    <div class="brand">Cool<span>Shop</span></div>
    <form th:action="@{/logout}" method="post" class="m-0">
        <button class="btn btn-logout" type="submit">Đăng xuất</button>
    </form>
</nav>

<main class="home-main">
    <h1>Xin chào, <span class="name" sec:authentication="name">User</span>!</h1>
    <p>Bạn đã đăng nhập thành công vào CoolShop.</p>
</main>
</body>
</html>

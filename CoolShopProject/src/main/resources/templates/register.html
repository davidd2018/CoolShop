<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo tài khoản - CoolShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<div>
    <div class="brand">Cool<span>Shop</span></div>

    <div class="auth-panel">
        <div class="auth-panel-body">
            <h1 class="auth-title">Tạo tài khoản</h1>

            <div th:if="${error}" class="alert auth-alert auth-alert-danger mb-3" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${account}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="accountName">Tên đăng nhập</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person-fill"></i>
                        <input class="form-control" type="text" id="accountName" th:field="*{accountName}"
                               placeholder="Tên đăng nhập" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-envelope-fill"></i>
                        <input class="form-control" type="email" id="email" th:field="*{email}"
                               placeholder="Email" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phonenumber">Số điện thoại</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-telephone-fill"></i>
                        <input class="form-control" type="text" id="phonenumber" th:field="*{phonenumber}"
                               placeholder="Số điện thoại">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="accountPassword">Mật khẩu</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-lock-fill"></i>
                        <input class="form-control" type="password" id="accountPassword" th:field="*{accountPassword}"
                               placeholder="Mật khẩu" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="gender">Giới tính</label>
                    <select class="form-select" id="gender" th:field="*{gender}" required>
                        <option value="">-- Chọn --</option>
                        <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                    </select>
                </div>
                <button class="btn btn-auth" type="submit">Đăng ký</button>
            </form>
        </div>

        <div class="auth-footer">
            <p>Đã có tài khoản?</p>
            <a class="btn-signup" th:href="@{/login}">Đăng nhập</a>
        </div>
    </div>
</div>
</body>
</html>
